services:
  iproject:
    build: .
    image: iproject-oms:latest
    container_name: iproject-oms
    restart: unless-stopped
    ports:
      # 模式 A：直接 IP:3001 访问（HTTP，不加密，适合内网/临时联调）
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - iproject-data:/app/data

  # 模式 B：域名 + HTTPS（自动申请/续期 Let's Encrypt 证书）
  # 默认不启动；启用： docker compose --profile https up -d
  # 启用前：.env 填好 DOMAIN + ACME_EMAIL；云控制台防火墙放通 80/443；域名 A 记录指向本机公网 IP
  caddy:
    image: caddy:2-alpine
    container_name: iproject-caddy
    restart: unless-stopped
    depends_on:
      - iproject
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env          # 读取 DOMAIN / ACME_EMAIL
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # 证书与 ACME 账户持久化（务必保留，否则每次重启重新申请）
      - caddy-config:/config
    profiles:
      - https

volumes:
  iproject-data:
  caddy-data:
  caddy-config:
