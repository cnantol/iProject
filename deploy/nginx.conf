# iProject-OMS Nginx 反代模板（域名 + HTTPS 的“手动”备选方案）
# 前置：应用容器仅监听 127.0.0.1:3001（compose 改 127.0.0.1:3001:3001），Nginx 对外暴露 80/443
# 证书由 certbot 申请后写入 /etc/letsencrypt/live/<域名>/
# 适用场景：不想用 Caddy、坚持用宿主机 Nginx 的情况。推荐优先用 deploy/Caddyfile（自动 HTTPS）。

# 80 端口：HTTP 全部 301 跳转到 HTTPS
server {
    listen 80;
    server_name your.domain.com;   # 改成你的域名
    return 301 https://$host$request_uri;
}

# 443 端口：HTTPS 反代到应用
server {
    listen 443 ssl;
    server_name your.domain.com;   # 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 上传大文件（附件/报价单）时按需调大
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
